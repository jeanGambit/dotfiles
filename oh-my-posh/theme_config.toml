console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[upgrade]
source = 'cdn'
interval = '168h'
auto = false
notice = false

[palette]
black = '#262B44'
blue = '#4B95E9'
green = '#36A259'
orange = '#F07623'
red = '#D81E5B'
white = '#E0DEF4'
yellow = '#F3AE35'
purple = '#6D006A'

[transient_prompt]
foreground_templates = [
  "{{if gt .Code 0}}red{{end}}",
  "{{if eq .Code 0}}magenta{{end}}",
]
background = 'transparent'
template = '─❯ '

[secondary_prompt]
foreground = 'magenta'
background = 'transparent'
template = '─❯❯ '

# -------- 1 row, left -------------------- #
[[blocks]]
type = 'prompt'
alignment = 'left'
## ------- 0 segment: leading segment ---- ##
[[blocks.segments]]
type = "text"
style = "plain"
foreground = "p:purple"
template = "┌ "
## ------- 1 segment: path segment ------- ##
[[blocks.segments]]
template = '  {{ path .Path .Location }} '
foreground = 'p:white'
leading_diamond = ''
trailing_diamond = ''
background = 'p:purple'
type = 'path'
style = 'diamond'
[blocks.segments.properties]
style = 'full'
## ------- 2 segment: git segment --------- ##
[[blocks.segments]]
template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} '
foreground = 'p:black'
powerline_symbol = ''
background = 'p:green'
type = 'git'
style = 'powerline'
foreground_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:black{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:white{{ end }}', '{{ if gt .Ahead 0 }}p:white{{ end }}']
background_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:green{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}', '{{ if gt .Ahead 0 }}#49416D{{ end }}', '{{ if gt .Behind 0 }}#7A306C{{ end }}']

[blocks.segments.properties]
branch_max_length = 25
fetch_status = true
fetch_upstream_icon = true

#─────────────────────────────────────
#[blocks]
#alignment = "right"
#filler = "─"
# -------- 1 row, right -------------------- #
[[blocks]]
type = 'rprompt'
# -------- 1 row: execution time ----------- #
[[blocks.segments]]
type = 'executiontime'
style = 'plain'
foreground = 'yellow'
background = 'transparent'
template = '{{ .FormattedMs }}'
[blocks.segments.properties]
threshold = 5000

# -------- 2 row, left -------------------- #
[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
type = "text"
style = "plain"
foreground = "p:purple"
template = "└❯"
[[segments]]
type = "session"
style = "plain"
foreground = "#ffffff"
background = "#007ACC"

[segments.properties]
display_host = true
display_user = true
always_enabled = true 
template = "{{ if .User }}👤 {{ .User }}{{ end }}{{ if .Host }} 🖥️ {{ .Host }}{{ end }}"

